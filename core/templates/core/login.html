{% extends 'core/base.html' %}
{% block title %}Sign in{% endblock %}{% block content %}<section class="auth-wrap container"><div class="auth-card"><div class="eyebrow">GOOD TO SEE YOU AGAIN</div><h1>Welcome back.</h1><p class="muted">Sign in with your password, then confirm the one-time code sent to your email.</p><form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label for="username">Username</label><input class="form-control mb-3" id="username" name="username" required autocomplete="username"><label for="password">Password</label><input class="form-control mb-2" id="password" type="password" name="password" required autocomplete="current-password"><p class="text-end"><a href="{% url 'password_reset' %}">Forgot password?</a></p><button class="btn btn-primary w-100 rounded-pill py-3" type="submit">Continue securely ↗</button></form><p class="text-center mt-4 mb-0">New to JobPilot? <a href="{% url 'register' %}">Create an account</a></p></div></section>{% endblock %}
